<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ติดตามสถานะงาน · บอลสติ๊กเกอร์</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd23f;--ink:#1b1b2f;--mut:#6b7280;--ok:#16a34a;--bg:#f5f6f8;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand img{width:40px;height:40px;border-radius:10px}.brand b{font-size:17px}.brand small{display:block;color:var(--mut);font-size:12.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{font-size:15px;margin:0 0 2px;color:var(--mut);font-weight:600}.no{font-size:24px;font-weight:700;margin:0 0 4px}
.now{display:inline-block;margin:6px 0 14px;padding:6px 14px;border-radius:999px;background:var(--y);font-weight:700;font-size:15px}.now.done{background:#dcfce7;color:#166534}
.steps{list-style:none;margin:0;padding:0}.steps li{position:relative;padding:0 0 18px 38px;color:var(--mut);font-size:15.5px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:'';position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--line)}.steps li:last-child::before{display:none}
.steps li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok);border-color:var(--ok)}.steps li.done::before{background:var(--ok)}
.steps li.cur{color:var(--ink);font-weight:700}.steps li.cur i{background:var(--y);border-color:var(--y);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);margin-top:14px;font-size:15px}.row span{color:var(--mut)}.row b{text-align:right;word-break:break-all}
.copy{margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 9px;font:inherit;font-size:13px;cursor:pointer}
.err{text-align:center;padding:26px 10px}.err b{display:block;font-size:17px;margin-bottom:6px}
.ct{margin-top:16px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.7}.ct a{color:var(--ink);font-weight:600}
.ph{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.ph h2{font-size:15px;margin:0 0 4px}.ph p{margin:0 0 10px;color:var(--mut);font-size:13px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pg figure{margin:0}.pg img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f3f4f6}
.sv{display:block;margin-top:6px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 0;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;background:#fff}
.go{display:block;margin-top:12px;text-align:center;background:var(--y);color:var(--ink);font-weight:700;border-radius:12px;padding:12px 0;text-decoration:none;font-size:15.5px}
.cn{margin:-2px 0 4px;font-size:15px;color:var(--mut)}.cn b{color:var(--ink)}
.upd{margin-top:10px;color:var(--mut);font-size:12.5px;text-align:right}
.ad{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.ad h2{font-size:15px;margin:0 0 8px}
.ab{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.55}.ab small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}.ab b{display:block}
.rf{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.rf h2{font-size:15px;margin:0 0 8px}
.pay{margin-top:4px;padding:14px;border:1px solid #fde68a;background:#fffbeb;border-radius:14px;text-align:center}
.pay h2{margin:0 0 4px;font-size:1rem;text-align:left}.pay .amt{font-size:1.9rem;font-weight:800;margin:6px 0}
.pay ul{list-style:none;margin:6px 0;padding:0;text-align:left;font-size:.9rem;color:#4b5563}.pay li{display:flex;justify-content:space-between;padding:2px 0}
.pay canvas{width:240px;max-width:100%;height:auto;border-radius:10px;background:#fff;border:1px solid #e5e7eb;margin-top:6px}
.pay small{display:block;color:#6b7280;margin-top:6px;line-height:1.5}.pay a.sv{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="icon-192.png" alt=""><div><b>บอลสติ๊กเกอร์ พิษณุโลก</b><small>ติดตามสถานะงานของคุณ</small></div></div>
  <div class="card" id="box"><p style="text-align:center;color:var(--mut);margin:20px 0">กำลังโหลดสถานะงาน…</p></div>
  <div class="ct">สอบถามเพิ่มเติม LINE <a href="https://line.me/R/ti/p/@bk25">@bk25</a> · โทร <a href="tel:0935353555">093-535-3555</a><br>จ–ส 09:00–17:00 น. (หยุดวันอาทิตย์)</div>
</div>
<script src="js/qr.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script>
(function () {
  var box = document.getElementById('box');
  var STEPS = [['pending', 'รับงานแล้ว · รอทำ'], ['filed', 'ทำไฟล์เสร็จแล้ว'], ['printed', 'ผลิตเสร็จแล้ว'], ['shipped', 'จัดส่งแล้ว']];
  var MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function thDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + (+m[1] + 543) : ''; }
  function fail(t, d) { box.innerHTML = '<div class="err"><b>' + esc(t) + '</b>' + esc(d || '') + '</div>'; }
  function show(j) {
    var idx = 0, i; for (i = 0; i < STEPS.length; i++) if (STEPS[i][0] === j.status) idx = i;
    var done = idx === STEPS.length - 1, lis = STEPS.map(function (s, k) {
      var c = k < idx || done ? 'done' : (k === idx ? 'cur' : '');
      return '<li class="' + c + '"><i>' + (c === 'done' ? '✓' : (k + 1)) + '</i>' + esc(s[1]) + '</li>';
    }).join('');
    var html = '<h1>ใบงานเลขที่</h1><p class="no">' + esc(j.no) + '</p>' + (j.cname ? '<div class="cn">ลูกค้า: <b>' + esc(j.cname) + '</b></div>' : '') + '<span class="now' + (done ? ' done' : '') + '">' + esc(STEPS[idx][1]) + '</span><ul class="steps">' + lis + '</ul>';
    var isJbs = /^JBS/i.test(String(j.no || ''));
    if (isJbs && (j.sender || j.receiver)) {
      html += '<div class="ad"><h2>📍 ที่อยู่จัดส่ง</h2>';
      if (j.sender) html += '<div class="ab"><small>ผู้ส่ง</small>' + (j.sender.name ? '<b>' + esc(j.sender.name) + '</b>' : '') + esc(j.sender.addr) + '</div>';
      if (j.receiver) html += '<div class="ab"><small>ผู้รับ</small>' + (j.receiver.name ? '<b>' + esc(j.receiver.name) + '</b>' : '') + esc(j.receiver.addr) + '</div>';
      html += '</div>';
    }
    var rp = (isJbs ? (j.refPhotos || []) : []).filter(function (u) { return typeof u === 'string' && /^https:\/\//.test(u); });
    if (rp.length) html += '<div class="rf"><h2>🖼 รูปอ้างอิง</h2><div class="pg">' + rp.map(function (u, k) { return '<figure><a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="รูปอ้างอิง ' + (k + 1) + '" loading="lazy"></a></figure>'; }).join('') + '</div></div>';
    if (isJbs && j.pay && +j.pay.total > 0 && typeof j.pay.payload === 'string' && /^000201/.test(j.pay.payload)) {
      html += '<div class="pay"><h2>💳 ยอดที่ต้องชำระ</h2><div class="amt">' + Number(j.pay.total).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' บาท</div>' +
        '<ul>' + (j.pay.docs || []).map(function (d) { return '<li><span>' + esc(d.no || 'ใบ') + '</span><span>' + Number(d.amount).toLocaleString('en-US', {minimumFractionDigits: 2}) + '</span></li>'; }).join('') + '</ul>' +
        '<canvas id="payQr" width="480" height="480" aria-label="QR พร้อมเพย์"></canvas><br><a class="sv" id="payQrSave" download="QR-ชำระเงิน.png" href="#">บันทึกรูป QR</a>' +
        '<small>สแกนด้วยแอปธนาคาร · ชื่อบัญชี ' + esc(j.pay.payee || '') + '<br>โอนแล้วร้านจะตรวจยอดให้อัตโนมัติ (หากไม่ขึ้นสถานะ แจ้งร้านทาง LINE @bk25)</small></div>';
    }
    if (j.due && !done) html += '<div class="row"><span>กำหนดส่ง</span><b>' + esc(thDate(j.due)) + '</b></div>';
    if (j.trackCode) html += '<div class="row"><span>เลขพัสดุ' + (j.carrier ? ' (' + esc(j.carrier) + ')' : '') + '</span><b>' + esc(j.trackCode) + '<button class="copy" id="cp" type="button">คัดลอก</button></b></div>';
    if (j.trackUrl && /^https:\/\//.test(j.trackUrl)) html += '<a class="go" href="' + esc(j.trackUrl) + '" target="_blank" rel="noopener">🔎 เช็คสถานะพัสดุ' + (j.carrier ? ' กับ ' + esc(j.carrier) : '') + '</a>';
    var ph = (j.photos || []).filter(function (u) { return typeof u === 'string' && /^https:\/\//.test(u); });
    if (ph.length && idx >= 2) {
      html += '<div class="ph"><h2>📷 รูปงานของคุณ</h2><p>กดปุ่ม “บันทึกรูป” หรือกดค้างที่รูปเพื่อบันทึกลงเครื่อง</p><div class="pg">' + ph.map(function (u, k) {
        var dl = u.indexOf('/upload/') > -1 ? u.replace('/upload/', '/upload/fl_attachment/') : u;
        return '<figure><a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="รูปงาน ' + (k + 1) + '" loading="lazy"></a><a class="sv" href="' + esc(dl) + '" download="' + esc((j.no || 'งาน') + '-' + (k + 1) + '.jpg') + '" target="_blank" rel="noopener">💾 บันทึกรูป</a></figure>';
      }).join('') + '</div></div>';
    }
    if (j.updatedAt) { var d = new Date(j.updatedAt); html += '<div class="upd">อัปเดตล่าสุด ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' น.</div>'; }
    box.innerHTML = html;
    try {
      var cv = document.getElementById('payQr');
      if (cv && window.qrEncode && j.pay) {
        var m = window.qrEncode(j.pay.payload), n = m.length, q = 4, sz = cv.width, cell = Math.floor(sz / (n + q * 2)), off = Math.floor((sz - cell * n) / 2), g = cv.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, sz, sz); g.fillStyle = '#000';
        for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (m[r][c]) g.fillRect(off + c * cell, off + r * cell, cell, cell);
        var sv = document.getElementById('payQrSave'); if (sv) sv.href = cv.toDataURL('image/png');
      }
    } catch (e) { var pc = document.querySelector('.pay'); if (pc) pc.insertAdjacentHTML('beforeend', '<small>แสดง QR ไม่ได้ กรุณาแจ้งร้านทาง LINE @bk25</small>'); }
    var cp = document.getElementById('cp'); if (cp) cp.onclick = function () { try { navigator.clipboard.writeText(j.trackCode); cp.textContent = 'คัดลอกแล้ว'; } catch (e) {} };
  }
  var t = (new URLSearchParams(location.search).get('t') || '').trim();
  if (!/^[a-z0-9]{12,40}$/i.test(t)) { fail('ลิงก์ไม่ถูกต้อง', 'กรุณาเปิดลิงก์ที่ร้านส่งให้ หรือสอบถามร้านทาง LINE'); return; }
  if (typeof firebase === 'undefined') { fail('เปิดหน้านี้ไม่ได้ชั่วคราว', 'ลองรีเฟรชหรือสอบถามร้านทาง LINE'); return; }
  var app = firebase.initializeApp({apiKey: "AIzaSyDgIyeVed6xnG7A8YLRhbvZfxJOoHYpVco", authDomain: "ball-sticker-d95c2.firebaseapp.com", projectId: "ball-sticker-d95c2", storageBucket: "ball-sticker-d95c2.firebasestorage.app", messagingSenderId: "646578838963", appId: "1:646578838963:web:36984908ecbfd79d183fc6"});
  var db = firebase.firestore(app);
  firebase.auth(app).signInAnonymously().catch(function () {}).then(function () {
    db.collection('publicJobs').doc(t).onSnapshot(function (snap) {
      if (!snap.exists) fail('ไม่พบงานนี้', 'ลิงก์อาจถูกยกเลิกหรือไม่ถูกต้อง สอบถามร้านทาง LINE @bk25 ได้เลย');
      else show(snap.data());
    }, function () { fail('โหลดสถานะไม่สำเร็จ', 'ลองรีเฟรชหน้านี้ หรือสอบถามร้านทาง LINE @bk25'); });
  });
})();
</script>
</body>
</html>
