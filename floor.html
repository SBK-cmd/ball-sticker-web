.hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.title b{font-size:17px}.title span{display:block;color:var(--mut);font-size:12px}
.demo.real{background:#dff5e6;color:#14532d;border-color:#9ad7ae}
.demo{background:#fff3cd;color:#7a5200;border:1px solid #f0d58a;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;pointer-events:auto}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:84px;backdrop-filter:blur(4px)}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}.kpi span{font-size:11px;color:var(--mut)}
.kpi.late b{color:var(--bad)}
.ctl{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:36px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.staff{position:fixed;right:12px;bottom:12px;width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px)}
.staff h3{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:600}
.sp1{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed var(--line)}
.sp1:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.sp1 b{font-size:13px}.sp1 small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3}
.hint{position:fixed;left:12px;bottom:56px;color:var(--mut);font-size:11.5px;background:var(--card);border-radius:8px;padding:2px 8px}
.lab{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px 8px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.lab b{font-weight:700}.lab i{font-style:normal;color:var(--mut);margin-left:4px}
.lab.room{background:#7a12d6;color:#fff;border-color:#7a12d6;font-weight:600}
.lab.w{background:#1f2933;color:#fff;border-color:#1f2933;font-size:11.5px}
.lab.w .tag{color:#ffd23f}.lab.w em{font-style:normal;opacity:.7;margin-left:3px;font-size:10.5px}
.card{position:fixed;right:12px;top:96px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;backdrop-filter:blur(4px)}
.card h2{margin:0 0 4px;font-size:14px}.card .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}.card .r span:first-child{color:var(--mut)}

@media(max-width:640px){.lab{font-size:10px;padding:1px 5px}.lab.room{background:#7a12d6;color:#fff;border-color:#7a12d6;font-weight:600}
.lab.w{font-size:10px}.card{top:auto;bottom:150px;right:12px;left:12px;width:auto}.staff{left:12px;width:auto;bottom:56px}.hint{display:none}.sp1 small{display:inline;margin-left:4px}}

@media(max-width:560px){.lab{font-size:9.5px;padding:1px 4px}.lab.w{font-size:9.5px}.lab.room{display:none}.kpi{min-width:64px;padding:3px 7px}.kpi b{font-size:16px}.demo{font-size:10.5px}}

document.getElementById('view').onclick=function(){mode=(mode+1)%VIEWS.length;var v=VIEWS[mode];yaw=v.yaw;pitch=v.pitch;dist=v.dist;this.textContent='มุมมอง: '+v.n;setCam()};
var speed=1,paused=false;
document.getElementById('pp').onclick=function(){paused=!paused;this.textContent=paused?'▶ เล่น':'⏸ หยุด';this.classList.toggle('on',!paused)};
[].forEach.call(document.querySelectorAll('.sp'),function(b){b.onclick=function(){speed=+b.dataset.sp;[].forEach.call(document.querySelectorAll('.sp'),function(x){x.classList.toggle('on',x===b)})}});
addEventListener('resize',function(){try{updateHud()}catch(e){}W=innerWidth;H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()});
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===== วนลูป =====
var clock=new THREE.Clock(),v3=new THREE.Vector3(),T=0;
function turn(w,tx,tz,dt,k){var want=Math.atan2(tx-w.pos.x,tz-w.pos.z),diff=((want-w.mesh.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;w.mesh.rotation.y+=diff*Math.min(1,dt*k)}
function step(w,dt){
  w.t+=dt;var m=w.mesh;
  if(w.state==='walk'||(w.state==='stroll'&&w.path.length)){
    var tp=w.path[0];if(!tp){arrive(w)}
    else{var dx=tp.x-w.pos.x,dz=tp.z-w.pos.z,d=Math.hypot(dx,dz),sp=2.0*dt;
      if(d<=sp){w.pos.set(tp.x,0,tp.z);w.path.shift();if(!w.path.length)arrive(w)}
      else{w.pos.x+=dx/d*sp;w.pos.z+=dz/d*sp;turn(w,tp.x,tp.z,dt,10)}
      var sw=Math.sin(w.t*9)*.7;m.legL.rotation.x=sw;m.legR.rotation.x=-sw;m.armL.rotation.x=w.carry?-1.2:-sw;m.armR.rotation.x=w.carry?-1.2:sw;m.position.y=Math.abs(Math.sin(w.t*9))*.04}}
  else if(w.state==='work'){w.wait-=dt;m.legL.rotation.x=m.legR.rotation.x=0;m.armL.rotation.x=w.carry?-1.2:Math.sin(w.t*6)*.25;m.armR.rotation.x=w.carry?-1.2:-Math.sin(w.t*6)*.25;m.position.y=0;
    var s=stn(w.face);turn(w,s.lx,s.lz,dt,6);
    if(w.wait<=0)afterWork(w)}
  else if(w.state==='stroll'){m.legL.rotation.x=m.legR.rotation.x=0;m.armL.rotation.x=m.armR.rotation.x=0}
  else if(w.state==='idle'){assign(w)}
  m.position.x=w.pos.x;m.position.z=w.pos.z;
  if(w.carry){var fx=Math.sin(m.rotation.y)*.45,fz=Math.cos(m.rotation.y)*.45;w.carry.mesh.position.set(w.pos.x+fx,1.2,w.pos.z+fz);w.carry.mesh.rotation.y=m.rotation.y}}
function animMachines(dt){T+=dt;
  var pr=JOBS.some(function(j){return j.zone==='print'}),ct=JOBS.some(function(j){return j.zone==='cut'});
  anim.yf.position.x=anim.yfx+(pr?Math.sin(T*3)*1.4:0);anim.cut.position.x=anim.cutx+(ct?Math.sin(T*2.2)*1.4:-1.0);anim.cut2.position.x=anim.cut2x+(ct?Math.sin(T*2.6+1)*.9:.6);
  anim.yfLed.material.emissiveIntensity=pr?.5+.5*Math.abs(Math.sin(T*4)):.15;anim.epLed.material.emissiveIntensity=.6+.4*Math.sin(T*2);
  var len=pr?Math.abs(Math.sin(T*.6))*.6:0;anim.yfPaper.scale.z=Math.max(.001,len*30);anim.yfPaper.position.z=2.8+1.15+len*.15}
function proj(obj,y,el){v3.copy(obj);v3.y=y;v3.project(cam);if(v3.z>1){el.style.display='none';return}el.style.display='';el.style.left=((v3.x+1)/2*innerWidth)+'px';el.style.top=((1-v3.y)/2*innerHeight)+'px'}
var cardT=0;
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);
  if(!paused&&!reduce){dt*=speed;WORK.forEach(function(w){step(w,dt)});spawn(dt);animMachines(dt)}
  setCam();
  STN.forEach(function(s){proj(new THREE.Vector3(s.lx,0,s.lz),3.2,labs[s.id])});roomLabs.forEach(function(r){proj(r.p,3.3,r.el)});
  WORK.forEach(function(w){var j=w.carry;w.lab.innerHTML=w.name+'<em>'+w.role.split(' · ')[0]+'</em>'+(j?' <span class="tag">▸ '+j.no+'</span>':'');proj(w.pos,2.2,w.lab);w.panel.textContent=w.act});
  cardT+=dt;if(selW&&cardT>.4){cardT=0;showCard(selW)}
  renderer.render(scene,cam)}
setCam();loop();

var MAPZ={pending:'design',filed:'print',printed:'pack',shipped:'out',pickup:'out',received:'out'};
function applyReal(list){
  WORK.forEach(function(w){w.act='เตรียมงาน'});
  REAL=true;TODAY=isoLocal(new Date());
  JOBS.forEach(function(j){jobGroup.remove(j.mesh)});JOBS.length=0;
  WORK.forEach(function(w){w.carry=null;w.task=null;if(w.state==='walk'){w.state='idle';w.path=[]}});
  RC={late:0};ORDER.forEach(function(z){RC[z]=0});
  var shown={};
  (list||[]).forEach(function(r){var z=MAPZ[r.status||'pending']||'design';RC[z]++;
    if(z!=='out'&&r.due&&r.due<TODAY)RC.late++;
    shown[z]=(shown[z]||0);if(shown[z]>=12)return;shown[z]++;
    var j={no:r.no||'',cust:r.cust||'',due:r.due||'9999-12-31',zone:z};mkJobMesh(j);j.carried=null;JOBS.push(j)});
  relayout();updateHud();
  var b=document.getElementById('banner');b.className='demo real';b.textContent='ข้อมูลจริงจากแอป · ใบงานวางตามสถานะ (รอทำ→โต๊ะออกแบบ · ทำไฟล์แล้ว→เครื่องพิมพ์ · ผลิตแล้ว→จุดแพ็ก · ส่งแล้ว→ชั้นส่ง) · การเดินของพนักงานเป็นภาพจำลอง'}
addEventListener('message',function(e){if(e.source!==parent||parent===window)return;var d=e.data;if(d&&d.type==='floor-jobs')applyReal(d.jobs)});
if(parent!==window){document.body.classList.add('emb');try{parent.postMessage({type:'floor-ready'},'*')}catch(x){}}
window.__dbg={WORK:WORK,JOBS:JOBS,applyReal:applyReal};
})();
</script>
