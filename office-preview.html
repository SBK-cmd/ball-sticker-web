<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ออฟฟิศ AI — บอลสติ๊กเกอร์ (พรีวิว)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#fff6d6;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#222;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top b{background:#ffc300;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 2px 8px #0002}
.top span{font-size:12px;background:#fffc;padding:5px 10px;border-radius:999px}
.tag{position:fixed;transform:translate(-50%,-100%);background:#fff;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:600;box-shadow:0 2px 8px #0003;white-space:nowrap;pointer-events:none;border:2px solid #ffc300}
.tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ecc71;margin-right:5px}
#bub{position:fixed;transform:translate(-50%,-100%);background:#222;color:#fff;border-radius:10px;padding:5px 10px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;max-width:180px}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-radius:16px;box-shadow:0 6px 24px #0004;padding:14px 16px;max-width:460px;margin:auto;transform:translateY(130%);transition:transform .3s}
#panel.on{transform:none}
#panel h2{font-size:17px;display:flex;gap:8px;align-items:center}
#panel h2 em{font-style:normal;font-size:11px;background:#ffc300;border-radius:99px;padding:2px 8px}
#panel p{font-size:13px;color:#555;margin:6px 0}
#panel ul{font-size:13px;padding-left:18px;margin:4px 0 8px}
#panel code{display:block;background:#fff6d6;border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit}
#panel button{position:absolute;right:10px;top:8px;border:0;background:#eee;border-radius:50%;width:28px;height:28px;font-size:15px}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#8a6d00;pointer-events:none;transition:opacity .3s}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><b>ออฟฟิศ AI · บอลสติ๊กเกอร์</b><span>พรีวิว</span></div>
<div id="tags"></div><div id="bub"></div>
<div class="hint" id="hint">แตะที่น้องๆ เพื่อดูหน้าที่ · ลากเพื่อหมุนห้อง</div>
<div id="panel"><button id="x" aria-label="ปิด">×</button><h2><span id="pn"></span><em id="pr"></em></h2><p id="pd"></p><ul id="pl"></ul><code id="pc"></code></div>
<script src="js/three.min.js"></script>
<script>
const AG=[
 {id:'programmer',name:'ช่าง โค้ด',role:'โปรแกรมเมอร์',col:0x3b82f6,pos:[-2.2,-1.6],say:['กำลังแก้บั๊ก…','ทดสอบบนมือถือ','รอคำว่า "อัพ"'],
  d:'แก้เว็บและแอปหลังร้าน ทดสอบจริงก่อนส่ง ทำใน preview เสมอ',l:['แก้หน้าตา/ฟังก์ชันแอป','ปรับหน้าเว็บร้าน','ตรวจบั๊กบนมือถือ'],c:'ให้ programmer ทำหน้าใบสั่งงานให้ใช้ในมือถือสะดวกขึ้น'},
 {id:'sticker-designer',name:'น้อง ดีไซน์',role:'นักออกแบบสติ๊กเกอร์',col:0xf472b6,pos:[2.2,-1.6],say:['เรียงแผ่นอยู่…','เช็กขอบไดคัท','ช่องไฟ 0.45 ซม.'],
  d:'เรียงชิ้นงานบนแผ่น ตรวจไฟล์ลูกค้าก่อนพิมพ์ คิดขอบไดคัท',l:['คำนวณจำนวนต่อแผ่น','ตรวจความละเอียด/พื้นหลัง','เสนอขนาดเสริมเติมพื้นที่เหลือ'],c:'ให้ sticker-designer เรียงสติ๊กเกอร์ 5×5 ซม. บน HP PVC ให้หน่อย'},
 {id:'chat-replier',name:'พี่ แอดมิน',role:'ตอบแชทลูกค้า',col:0x34d399,pos:[-2.2,1.5],say:['ร่างคำตอบ LINE','ถามขนาด/จำนวน','ส่งต่อเจ้าของร้าน'],
  d:'ร่างคำตอบภาษาไทยให้คุณกดส่งเอง ไม่เดาราคาหรือวันส่ง',l:['ร่างคำตอบพร้อมส่ง','ถามข้อมูลที่ขาด ≤3 ข้อ','ส่งต่อเมื่อเป็นเรื่องราคา/เคลม'],c:'ให้ chat-replier ตอบลูกค้า: "ทำสติ๊กเกอร์โฮโลแกรม 100 ชิ้นเท่าไหร่คะ"'},
 {id:'accountant',name:'คุณ บัญชี',role:'ผู้ช่วยบัญชี',col:0xfb923c,pos:[2.2,1.5],say:['คำนวณ VAT 7%','เทียบยอดรวม','ตรวจเงินเข้า-ออก'],
  d:'สรุปรับ-จ่าย VAT ตรวจบิล ตัวเลขทุกตัวคำนวณด้วยโค้ด',l:['สรุปรายเดือน','แยกเพจ/บัญชี','จับยอดผิดปกติ'],c:'ให้ accountant สรุปรายรับ-รายจ่ายเดือนนี้จากไฟล์ที่แนบ'}
];
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0xfff6d6);
const cam=new THREE.PerspectiveCamera(40,1,.1,100);
S.add(new THREE.HemisphereLight(0xffffff,0xffe2a0,.85));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});S.add(sun);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}
function ball(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),M(c));m.position.set(x,y,z);m.castShadow=true;(p||S).add(m);return m}
// room
box(10,.2,8,0xf3e3b3,0,-.1,0);
box(10,3.2,.2,0xffffff,0,1.6,-4);box(.2,3.2,8,0xfff9e6,-5,1.6,0);
box(10,.18,.05,0xffc300,0,.09,-3.88);
box(3.2,1.6,.05,0x9bd4ff,2.6,1.9,-3.88);box(3.3,.1,.1,0xffffff,2.6,1.1,-3.85);box(.1,1.7,.1,0xffffff,2.6,1.9,-3.85);
box(3,.7,.06,0xffc300,-2,2.4,-3.88);
const sg=document.createElement('canvas');sg.width=512;sg.height=112;const g=sg.getContext('2d');g.fillStyle='#ffc300';g.fillRect(0,0,512,112);g.fillStyle='#222';g.font='600 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('BALL STICKER',256,58);
const sm=new THREE.Mesh(new THREE.PlaneGeometry(2.9,.63),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sg)}));sm.position.set(-2,2.4,-3.84);S.add(sm);
// rug
const rug=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,.03,40),M(0xffd84d));rug.position.set(0,.02,0);rug.receiveShadow=true;S.add(rug);
// plant
box(.5,.5,.5,0xb45309,-4.4,.25,-3.3);ball(.5,0x22a05a,-4.4,.95,-3.3);ball(.35,0x2fbf71,-4.25,1.35,-3.2);
// plotter machine
box(1.8,.9,.9,0xdddddd,4,.45,-3.1);box(1.8,.12,.9,0x444444,4,.96,-3.1);box(1.4,.04,.6,0xffc300,4,1.04,-2.7);
const roll=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,1.5,20),M(0xffffff));roll.rotation.z=Math.PI/2;roll.position.set(4,1.2,-3.1);S.add(roll);
const stack=[];for(let i=0;i<4;i++)stack.push(box(.5,.04,.5,[0xff5f5f,0xffc300,0x4ade80,0x60a5fa][i],4.6,.02+i*.05,-2.2+i*.02));
// agents
const ags=[],pick=[];
AG.forEach(a=>{
 const grp=new THREE.Group();grp.position.set(a.pos[0],0,a.pos[1]);S.add(grp);
 const front=a.pos[1]<0?1:-1; // faces room centre? desk behind agent
 const side=a.pos[1]<0?-1:1;grp.rotation.y=a.pos[1]<0?0:Math.PI;
 // desk in front of character (towards -z local => monitor)
 box(1.7,.08,.85,0xffffff,0,.75,-.75,grp);
 [[-.75,-.35],[.75,-.35],[-.75,-1.15],[.75,-1.15]].forEach(p=>box(.08,.75,.08,0x999999,p[0],.37,p[1],grp));
 box(.7,.45,.05,0x222222,0,1.2,-.95,grp);const scr=box(.62,.37,.02,0x93c5fd,0,1.2,-.92,grp);scr.material=new THREE.MeshBasicMaterial({color:0x93c5fd});
 box(.1,.2,.1,0x555555,0,.9,-.95,grp);box(.5,.03,.18,0xeeeeee,0,.8,-.6,grp);
 // chair
 box(.7,.08,.7,0x333333,0,.45,.15,grp);box(.7,.7,.08,0x333333,0,.85,.5,grp);box(.1,.4,.1,0x666666,0,.22,.15,grp);
 // character
 const ch=new THREE.Group();ch.position.set(0,0,.1);grp.add(ch);
 box(.45,.12,.3,0x374151,0,.62,0,ch);box(.4,.55,.28,a.col,0,.98,0,ch);
 const head=ball(.24,0xffd9b3,0,1.5,0,ch);
 ball(.25,0x2b2118,0,1.57,.04,ch).scale.set(1,.7,1);
 ball(.04,0x111111,-.09,1.5,-.22,ch);ball(.04,0x111111,.09,1.5,-.22,ch);
 const armL=box(.12,.12,.55,a.col,-.27,1.0,-.28,ch),armR=box(.12,.12,.55,a.col,.27,1.0,-.28,ch);
 box(.14,.5,.14,0x374151,-.12,.35,-.25,ch);box(.14,.5,.14,0x374151,.12,.35,-.25,ch);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.75,.85,40),new THREE.MeshBasicMaterial({color:0xffc300,side:2,transparent:true,opacity:0}));ring.rotation.x=-Math.PI/2;ring.position.y=.04;grp.add(ring);
 const hit=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.9,1.9),new THREE.MeshBasicMaterial({visible:false}));hit.position.set(0,.95,-.3);hit.userData.a=a;grp.add(hit);pick.push(hit);
 const el=document.createElement('div');el.className='tag';el.innerHTML='<i></i>'+a.name;document.getElementById('tags').appendChild(el);
 ags.push({a,grp,ch,head,armL,armR,ring,el,scr});
});
// camera orbit
let az=Math.PI/4*.4,el_=.62,dist=15,tAz=az,tEl=el_,tDist=dist;
function setCam(){const cx=Math.sin(az)*Math.cos(el_)*dist,cy=Math.sin(el_)*dist,cz=Math.cos(az)*Math.cos(el_)*dist;cam.position.set(cx,cy+.8,cz);cam.lookAt(0,.9,-.2)}
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;tDist=w/h<.8?22:w/h<1.3?17:14.5;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();dist=tDist;
let drag=null,moved=0;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag={x:e.clientX,y:e.clientY};tAz=Math.max(-1.1,Math.min(1.1,tAz-dx*.006));tEl=Math.max(.3,Math.min(1.1,tEl+dy*.004))});
cv.addEventListener('pointerup',e=>{drag=null;if(moved<8)tap(e)});
cv.addEventListener('wheel',e=>{tDist=Math.max(9,Math.min(26,tDist+e.deltaY*.01))},{passive:true});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let sel=null;
function tap(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pick)[0];h?choose(h.object.userData.a):choose(null)}
const $=id=>document.getElementById(id);
function choose(a){sel=a;const p=$('panel');if(!a){p.classList.remove('on');return}
 $('pn').textContent=a.name;$('pr').textContent=a.role;$('pd').textContent=a.d;$('pl').innerHTML=a.l.map(t=>'<li>'+t+'</li>').join('');$('pc').textContent='ลองสั่ง: '+a.c;p.classList.add('on');$('hint').style.opacity=0}
$('x').onclick=()=>choose(null);
const V=new THREE.Vector3();
function proj(o,y,el){o.getWorldPosition(V);V.y+=y;V.project(cam);el.style.left=(V.x*.5+.5)*innerWidth+'px';el.style.top=(-V.y*.5+.5)*innerHeight+'px'}
const bub=$('bub');let bi=0,bt=0;
const clock=new THREE.Clock();
function loop(){const t=clock.getElapsedTime();
 az+=(tAz-az)*.1;el_+=(tEl-el_)*.1;dist+=(tDist-dist)*.1;setCam();
 ags.forEach((o,i)=>{const typing=Math.sin(t*9+i)>-.2;
  o.armL.position.y=1.0+(typing?Math.sin(t*14+i)*.02:0);o.armR.position.y=1.0+(typing?Math.cos(t*13+i)*.02:0);
  o.ch.position.y=Math.sin(t*2+i)*.01;o.head.rotation.y=Math.sin(t*.8+i*2)*.25;
  o.scr.material.color.setHSL(.58,.8,.75+Math.sin(t*3+i)*.08);
  o.ring.material.opacity=sel===o.a?.9:0;
  proj(o.grp,2.0,o.el)});
 if(t>bt){bt=t+3.2;const o=ags[bi++%ags.length];const s=o.a.say[(bi>>2)%3];bub.textContent=s;bub.dataset.i=ags.indexOf(o);bub.style.opacity=1;setTimeout(()=>bub.style.opacity=0,2400)}
 const o=ags[bub.dataset.i|0];if(o){proj(o.grp,2.45,bub)}
 R.render(S,cam);requestAnimationFrame(loop)}
loop();
</script></body></html>
